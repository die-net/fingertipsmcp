name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Check, lint, test, build
        run: ./gradlew spotlessCheck detektMain detektTest lint testDebugUnitTest :api-model:test :browser:test :server:test :chrome:test assembleDebug :chrome:fatJar buildHealth --continue

      # Runs the fat jar, so a broken merge of its dependencies' service files fails here. --attach to
      # a closed port starts no Chrome, and the server still listens and answers without a token.
      - name: Run the fingertips-chrome jar
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/fingertips-config
          XDG_DATA_HOME: ${{ runner.temp }}/fingertips-data
        run: |
          jar=chrome/build/dist/fingertipsmcp-chrome.jar
          java -jar "$jar" --version
          java -jar "$jar" --attach 9 --port 47199 2> "$RUNNER_TEMP/serve.log" &
          pid=$!
          i=0
          until curl -s -o /dev/null http://127.0.0.1:47199/v1/device; do
            i=$((i + 1))
            if [ "$i" -ge 150 ]; then
              echo "fingertips-chrome did not answer within 30 s"
              cat "$RUNNER_TEMP/serve.log"
              exit 1
            fi
            sleep 0.2
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:47199/v1/device)
          kill "$pid"
          cat "$RUNNER_TEMP/serve.log"
          test "$code" = 404
          # slf4j warns on stderr when the jar lost its provider's service file.
          if grep -q 'SLF4J' "$RUNNER_TEMP/serve.log"; then exit 1; fi

      # Code scanning on a private repository needs GitHub Code Security.
      - name: Upload detekt SARIF
        if: always() && !github.event.repository.private && hashFiles('build/reports/detekt/merge.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/detekt/merge.sarif
          category: detekt

      - name: Upload Lint SARIF
        if: always() && !github.event.repository.private && hashFiles('app/build/reports/lint-results-debug.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          category: android-lint

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            !**/build/reports/configuration-cache/

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: fingertipsmcp-android-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload fingertips-chrome jar
        uses: actions/upload-artifact@v7
        with:
          name: fingertips-chrome
          path: chrome/build/dist/fingertipsmcp-chrome.jar

  windows:
    # Runs the fat jar on Windows with the Google Chrome the runner has installed, from the files it keeps
    # under %LOCALAPPDATA%, and checks it as the image is checked. Then it ends the server and checks
    # that Chrome exits once its DevTools pipe closes, so no Chrome is left holding the profile.
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: fingertips-chrome
          path: chrome/build/dist

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run fingertips-chrome
        run: |
          jar=chrome/build/dist/fingertipsmcp-chrome.jar
          files="$(cygpath -u "$LOCALAPPDATA")/fingertips-chrome"
          log="$(cygpath -u "$RUNNER_TEMP")/serve.log"
          java -jar "$jar" --version
          java -jar "$jar" token create --scopes observe,control,browser,stream
          # The server keeps running into the next step, which stops it.
          java -jar "$jar" 2> "$log" &
          node chrome/docker/smoke-test.mjs "$files/pairing.json"
          # One Chrome for the whole run: closing its last tab did not make it exit and start again.
          test "$(grep -c 'Started Chrome' "$log")" = 1
          if grep -q 'The browser exited' "$log"; then exit 1; fi
          # slf4j warns on stderr when the jar lost its provider's service file.
          if grep -q 'SLF4J' "$log"; then exit 1; fi

      # Ends the server alone, as a crash would, so no shutdown hook runs and Chrome sees only its
      # pipe close. Stop-Process -Force terminates just that process. Git Bash's kill is no use here:
      # it injects ExitProcess and falls back to ending the whole tree, Chrome's processes included.
      - name: Chrome exits when the pipe closes
        shell: pwsh
        run: |
          $server = @(Get-CimInstance Win32_Process -Filter "Name='java.exe'" |
              Where-Object CommandLine -like '*fingertipsmcp-chrome.jar*')
          if ($server.Count -ne 1) {
            Write-Error "Expected one fingertips-chrome server, found $($server.Count)"
            exit 1
          }
          Stop-Process -Id $server[0].ProcessId -Force
          $deadline = (Get-Date).AddSeconds(30)
          while ($true) {
            $left = @(Get-CimInstance Win32_Process -Filter "Name='chrome.exe'" |
                Where-Object CommandLine -like '*fingertips-chrome*')
            if ($left.Count -eq 0) { break }
            if ((Get-Date) -gt $deadline) {
              $left | Format-List ProcessId, ParentProcessId, CommandLine | Out-String -Width 400 | Write-Host
              Write-Error "$($left.Count) Chrome processes were still running 30 s after the server stopped"
              exit 1
            }
            Start-Sleep -Seconds 1
          }

      - name: Server and Chrome logs
        if: always()
        run: |
          cat "$(cygpath -u "$RUNNER_TEMP")/serve.log" || true
          cat "$(cygpath -u "$LOCALAPPDATA")/fingertips-chrome/chrome.log" || true

  image:
    # Builds the Docker image from the definition the release pushes, and runs it as docs/chrome.md says a
    # person would. arm64 runs on GitHub's arm64 runner rather than under QEMU.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: fingertips-chrome
          path: chrome/build/dist

      - uses: docker/setup-buildx-action@v4

      - uses: docker/bake-action@v7
        with:
          source: .
          targets: fingertipsmcp-chrome
          load: true
          set: |
            fingertipsmcp-chrome.platform=${{ matrix.platform }}
            fingertipsmcp-chrome.tags=fingertipsmcp-chrome:ci

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run the image
        run: |
          image=fingertipsmcp-chrome:ci
          docker image ls "$image"
          # Each layer's size, so a change to the Dockerfile shows what it adds or saves.
          docker history --format '{{.Size}}\t{{.CreatedBy}}' "$image" | cut -c1-120
          docker run --rm --entrypoint google-chrome "$image" --version
          docker run --rm --entrypoint java "$image" -version
          docker volume create fingertips-chrome-config
          docker volume create fingertips-chrome-data
          docker run --rm -v fingertips-chrome-config:/home/fingertips/.config/fingertips-chrome "$image" \
            token create --scopes observe,control,browser,stream
          docker run -d --name fingertips-chrome --shm-size=1g \
            --security-opt seccomp=chrome/docker/seccomp.json \
            -v fingertips-chrome-config:/home/fingertips/.config/fingertips-chrome \
            -v fingertips-chrome-data:/home/fingertips/.local/share/fingertips-chrome \
            -p 127.0.0.1:47100:47100 \
            "$image"
          docker run --rm -v fingertips-chrome-config:/c alpine cat /c/pairing.json > "$RUNNER_TEMP/pairing.json"
          node chrome/docker/smoke-test.mjs "$RUNNER_TEMP/pairing.json"
          # One Chrome for the whole run: closing its last tab did not make it exit and start again.
          docker logs fingertips-chrome > "$RUNNER_TEMP/container.log" 2>&1
          test "$(grep -c 'Started Chrome' "$RUNNER_TEMP/container.log")" = 1
          ! grep -q 'The browser exited' "$RUNNER_TEMP/container.log"
          # The JVM warns on stderr about calls a later Java may refuse, such as loading a native library.
          ! grep -q '^WARNING:' "$RUNNER_TEMP/container.log"

      - name: Container and Chrome logs
        if: always()
        run: |
          docker ps -a --filter name=fingertips-chrome
          docker logs fingertips-chrome || true
          docker run --rm -v fingertips-chrome-data:/d alpine cat /d/chrome.log || true
