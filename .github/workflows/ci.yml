name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Check, lint, test, build
        run: ./gradlew spotlessCheck detektMain detektTest lint testDebugUnitTest :api-model:test :browser:test :server:test :chrome:test assembleDebug :chrome:fatJar buildHealth --continue

      # Runs the fat jar, so a broken merge of its dependencies' service files fails here. --attach to
      # a closed port starts no Chrome, and the server still listens and answers without a token.
      - name: Run the fingertips-chrome jar
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/fingertips-config
          XDG_DATA_HOME: ${{ runner.temp }}/fingertips-data
        run: |
          jar=chrome/build/dist/fingertipsmcp-chrome.jar
          java -jar "$jar" --version
          java -jar "$jar" --attach 9 --port 47199 2> "$RUNNER_TEMP/serve.log" &
          pid=$!
          i=0
          until curl -s -o /dev/null http://127.0.0.1:47199/v1/device; do
            i=$((i + 1))
            if [ "$i" -ge 150 ]; then
              echo "fingertips-chrome did not answer within 30 s"
              cat "$RUNNER_TEMP/serve.log"
              exit 1
            fi
            sleep 0.2
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:47199/v1/device)
          kill "$pid"
          cat "$RUNNER_TEMP/serve.log"
          test "$code" = 404
          # slf4j warns on stderr when the jar lost its provider's service file.
          if grep -q 'SLF4J' "$RUNNER_TEMP/serve.log"; then exit 1; fi

      # Code scanning on a private repository needs GitHub Code Security.
      - name: Upload detekt SARIF
        if: always() && !github.event.repository.private && hashFiles('build/reports/detekt/merge.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/detekt/merge.sarif
          category: detekt

      - name: Upload Lint SARIF
        if: always() && !github.event.repository.private && hashFiles('app/build/reports/lint-results-debug.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          category: android-lint

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            !**/build/reports/configuration-cache/

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: fingertipsmcp-android-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload fingertips-chrome jar
        uses: actions/upload-artifact@v7
        with:
          name: fingertips-chrome
          path: chrome/build/dist/fingertipsmcp-chrome.jar
