name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PHONEAPI_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "PHONEAPI_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK and fingertipsmcp-chrome.jar
        env:
          FINGERTIPS_VERSION: ${{ github.ref_name }}
          FINGERTIPS_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          FINGERTIPS_KEYSTORE_PASSWORD: ${{ secrets.PHONEAPI_KEYSTORE_PASSWORD }}
          FINGERTIPS_KEY_ALIAS: ${{ secrets.PHONEAPI_KEY_ALIAS }}
          FINGERTIPS_KEY_PASSWORD: ${{ secrets.PHONEAPI_KEY_PASSWORD }}
        run: ./gradlew spotlessCheck detektMain detektTest lint testDebugUnitTest :api-model:test :browser:test :server:test :chrome:test assembleRelease :chrome:fatJar buildHealth

      - name: Collect artifacts
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/fingertipsmcp-android-${GITHUB_REF_NAME}.apk"
          cp chrome/build/dist/fingertipsmcp-chrome.jar "dist/fingertipsmcp-chrome-${GITHUB_REF_NAME}.jar"
          cd dist && sha256sum *.apk *.jar > SHA256SUMS

      # Attestations on a private repository need GitHub Enterprise Cloud.
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            dist/*.apk
            dist/*.jar

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.apk
            dist/*.jar
            dist/SHA256SUMS
          generate_release_notes: true

      - uses: actions/upload-artifact@v7
        with:
          name: fingertipsmcp-chrome-jar
          path: chrome/build/dist/fingertipsmcp-chrome.jar

  image:
    # ghcr.io/die-net/fingertipsmcp-chrome: Google Chrome on Xvfb, for amd64 and arm64. The jar is the same on
    # both. Each platform builds on a runner of its own architecture and pushes its image by digest, and
    # `image-manifest` joins the two under the tags. There is no layer cache, so every release builds the
    # Chrome stable of that day.
    needs: release
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: fingertipsmcp-chrome-jar
          path: chrome/build/dist

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the labels matter here. The tags go on in `image-manifest`.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/fingertipsmcp-chrome

      # docker-bake.hcl is the build CI tests. The image is pushed by digest, with no tag.
      - id: push
        uses: docker/bake-action@v7
        with:
          source: .
          files: |
            ./docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
          targets: fingertipsmcp-chrome
          set: |
            fingertipsmcp-chrome.platform=${{ matrix.platform }}
            fingertipsmcp-chrome.tags=
            fingertipsmcp-chrome.output=type=image,name=ghcr.io/${{ github.repository_owner }}/fingertipsmcp-chrome,push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest
        env:
          DIGEST: ${{ fromJSON(steps.push.outputs.metadata)['fingertipsmcp-chrome']['containerimage.digest'] }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    # Joins the per-platform images into one multi-platform image under the release tags.
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/fingertipsmcp-chrome
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create the manifest list
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/fingertipsmcp-chrome
        run: |
          digests=(*)
          test "${#digests[@]}" = 2
          # shellcheck disable=SC2046 # The word splitting builds the -t flags and the digest references.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " "${digests[@]}")
          first_tag="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          docker buildx imagetools inspect "$first_tag"
          index="$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}')"
          # The index must hold an image for each platform, besides any attestation manifests.
          for platform in linux/amd64 linux/arm64; do
            jq -e --arg p "$platform" 'any(.manifests[]; (.platform.os + "/" + .platform.architecture) == $p)' <<< "$index" > /dev/null
          done
          echo "digest=$(jq -r .digest <<< "$index")" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/fingertipsmcp-chrome
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
