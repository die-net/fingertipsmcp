<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FingertipsMCP</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 14px sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; user-select: none; }
    #stage { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
    canvas { max-width: 100%; max-height: 100%; background: #000; touch-action: none; cursor: crosshair; }
    #keys { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.4rem; width: min(32rem, 100%); padding: 0.35rem 0.5rem 0; box-sizing: border-box; }
    #keys button { width: 2.25rem; height: 2.25rem; padding: 0; display: grid; place-items: center; background: #1c1c1c; color: #ddd; border: 1px solid #3a3a3a; border-radius: 4px; touch-action: manipulation; }
    #keys button:active { background: #333; }
    #keys svg { width: 1.25rem; height: 1.25rem; fill: currentColor; }
    p { margin: 0.4rem 0.5rem 0.6rem; max-width: 40rem; text-align: center; }
    [hidden] { display: none !important; }
    /* Every message sits in the same grid cell, hidden ones included, so the bar is as tall as its
       longest message at any width, and the video doesn't move when the screen changes hands. */
    #lease { display: grid; margin: 0.4rem 0.5rem 0; width: min(40rem, calc(100% - 1rem)); color: #f0c674; text-align: center; }
    #lease > div { grid-area: 1 / 1; display: flex; align-items: center; justify-content: center; gap: 0.5rem; visibility: hidden; }
    #lease > div.shown { visibility: visible; }
    #notice { color: #f0c674; }
    #lease button { flex: none; padding: 0.3rem 0.8rem; background: #3a2f12; color: #f0c674; border: 1px solid #806a2a; border-radius: 4px; font: inherit; }
  </style>
</head>
<body>
<div id="stage"><canvas id="screen" width="2" height="2"></canvas></div>
<nav id="keys" aria-label="Phone buttons">
  <button type="button" data-key="BACK" title="Back" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg></button>
  <button type="button" data-key="HOME" title="Home" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg></button>

  <button type="button" data-key="VOLUME_DOWN" title="Volume down" aria-label="Volume down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9z"/></svg></button>
  <button type="button" data-key="VOLUME_UP" title="Volume up" aria-label="Volume up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
  <button type="button" data-key="VOLUME_MUTE" title="Mute" aria-label="Mute"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9zM12 4 9.91 6.09 12 8.18z"/></svg></button>

  <button type="button" data-key="LOCK" title="Lock" aria-label="Lock"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2m-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2m3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1z"/></svg></button>
  <button type="button" data-key="NOTIFICATIONS" title="Notifications" aria-label="Notifications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2m6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1z"/></svg></button>
  <button type="button" data-key="QUICK_SETTINGS" title="Quick settings" aria-label="Quick settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17v2h6v-2zm0-12v2h10V5zm10 16v-2h8v-2h-8v-2h-2v6zM7 9v2H3v2h4v2h2V9zm14 4v-2H11v2zm-6-4h2V7h4V5h-4V3h-2z"/></svg></button>
  <button type="button" id="orientation" title="Orientation" aria-label="Orientation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h1.5C23.44 4.84 18.29 0 12 0l-.66.03 3.81 3.81zm-6.25-.77c-.59-.59-1.54-.59-2.12 0L1.75 8.11c-.59.59-.59 1.54 0 2.12l12.02 12.02c.59.59 1.54.59 2.12 0l6.36-6.36c.59-.59.59-1.54 0-2.12L10.23 1.75zm4.6 19.44L2.81 9.17l6.36-6.36 12.02 12.02zm-7.31.29C4.25 19.94 1.91 16.76 1.55 13H.05c.5 6.16 5.66 11 11.95 11l.66-.03-3.81-3.81z"/></svg></button>
</nav>
<div id="lease">
  <div id="lease-other"><span></span><button type="button" id="take">Take over</button></div>
  <div id="lease-took"><span></span><button type="button" class="done">Done</button></div>
  <div id="lease-mine"><span></span><button type="button" class="done">Done</button></div>
</div>
<p id="notice" hidden></p>
<p id="status">Connecting</p>
<script>
const status = document.getElementById("status");
const notice = document.getElementById("notice");
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
function socket(path) {
  const scheme = location.protocol === "https:" ? "wss://" : "ws://";
  return new WebSocket(scheme + location.host + path);
}

function startCodes(bytes) {
  const nals = [];
  let i = 0;
  while (i + 3 < bytes.length) {
    let start = -1;
    let mark = 0;
    if (bytes[i] === 0 && bytes[i + 1] === 0 && bytes[i + 2] === 1) {
      start = i + 3;
      mark = 3;
    } else if (i + 4 < bytes.length && bytes[i] === 0 && bytes[i + 1] === 0 && bytes[i + 2] === 0 && bytes[i + 3] === 1) {
      start = i + 4;
      mark = 4;
    }
    if (start < 0) { i += 1; continue; }
    let end = bytes.length;
    for (let j = start; j + 3 < bytes.length; j++) {
      if (bytes[j] === 0 && bytes[j + 1] === 0 && (bytes[j + 2] === 1 || (bytes[j + 2] === 0 && bytes[j + 3] === 1))) {
        end = j;
        break;
      }
    }
    nals.push(bytes.subarray(start, end));
    i = end;
  }
  return nals;
}

function avcc(nals) {
  let size = 0;
  for (const nal of nals) size += 4 + nal.length;
  const out = new Uint8Array(size);
  let offset = 0;
  for (const nal of nals) {
    out[offset] = (nal.length >>> 24) & 255;
    out[offset + 1] = (nal.length >>> 16) & 255;
    out[offset + 2] = (nal.length >>> 8) & 255;
    out[offset + 3] = nal.length & 255;
    out.set(nal, offset + 4);
    offset += 4 + nal.length;
  }
  return out;
}

function decoderConfig(nals) {
  const sps = nals.find((nal) => (nal[0] & 31) === 7);
  const pps = nals.find((nal) => (nal[0] & 31) === 8);
  if (!sps || !pps) return null;
  const hex = (n) => n.toString(16).padStart(2, "0");
  const codec = "avc1." + hex(sps[1]) + hex(sps[2]) + hex(sps[3]);
  const description = new Uint8Array(11 + sps.length + pps.length);
  description.set([1, sps[1], sps[2], sps[3], 255, 225, (sps.length >> 8) & 255, sps.length & 255]);
  description.set(sps, 8);
  let at = 8 + sps.length;
  description[at] = 1;
  description[at + 1] = (pps.length >> 8) & 255;
  description[at + 2] = pps.length & 255;
  description.set(pps, at + 3);
  return { codec, description };
}

function reportDecoder(error) {
  if (!window.isSecureContext) {
    status.textContent = "VideoDecoder is missing. WebCodecs needs https or http://127.0.0.1; this page is " + location.protocol + "//" + location.host + ".";
    return;
  }
  status.textContent = error
    ? "VideoDecoder failed: " + error
    : "VideoDecoder is missing. This browser has no WebCodecs.";
}

// The phone sends at least one frame every 4 s, even from a still screen, so a longer gap with
// no picture means the stream is stuck and is worth reopening.
const STALL_MS = 12000;
const RETRY_MIN_MS = 1000;
const RETRY_MAX_MS = 10000;
let lastPicture = 0;
let retryMs = RETRY_MIN_MS;
let retryTimer = 0;

let epoch = 0;
function makeDecoder() {
  if (typeof VideoDecoder !== "function") {
    reportDecoder();
    return null;
  }
  const mine = ++epoch;
  try {
    return new VideoDecoder({
      output(frame) {
        if (mine !== epoch) { frame.close(); return; }
        if (canvas.width !== frame.displayWidth) canvas.width = frame.displayWidth;
        if (canvas.height !== frame.displayHeight) canvas.height = frame.displayHeight;
        ctx.drawImage(frame, 0, 0);
        frame.close();
        // A frame from this decoder is from the stream the last header described, so the picture
        // and the screen size its points map to change together.
        display = headerDisplay;
        lastPicture = performance.now();
        retryMs = RETRY_MIN_MS;
        status.textContent = canvas.width + "×" + canvas.height;
      },
      // A decoder that failed is closed and decodes nothing more, so start the stream over.
      error(e) {
        if (mine !== epoch) return;
        stopVideo();
        status.textContent = "Video decoder failed: " + e + ". Reconnecting.";
        retryVideo();
      }
    });
  } catch (error) {
    reportDecoder(error);
    return null;
  }
}
let video = null;
let videoSocket = null;
// The phone's screen size from the latest video header, and from the header of the picture on
// the canvas, which pointer input maps to. Null until a picture is drawn.
let headerDisplay = null;
let display = null;
let configured = false;
let needKey = true;
let streamWidth = 0;
let streamHeight = 0;

function configureVideo(payload) {
  if (!video) return;
  const config = decoderConfig(startCodes(payload));
  if (!config || configured) return;
  if (video.state === "closed") return;
  try {
    video.configure({ codec: config.codec, description: config.description, optimizeForLatency: true });
  } catch (error) {
    reportDecoder(error);
    return;
  }
  configured = true;
  needKey = true;
}

// What the input socket's pointer drives: "touch", a phone's screen, or "mouse", a desktop
// browser's tab. A mouse also hovers and scrolls, and has no phone buttons.
let pointerKind = "touch";

function onHeader(info) {
  pointerKind = info.pointer === "mouse" ? "mouse" : "touch";
  document.getElementById("keys").hidden = pointerKind === "mouse";
  canvas.style.cursor = pointerKind === "mouse" ? "default" : "";
  const changed = streamWidth !== 0 && (info.width !== streamWidth || info.height !== streamHeight);
  streamWidth = info.width;
  streamHeight = info.height;
  headerDisplay = { widthPx: info.displayWidth, heightPx: info.displayHeight };
  status.textContent = info.width + "×" + info.height;
  if (!changed) return;
  if (video && video.state !== "closed") video.close();
  video = makeDecoder();
  configured = false;
}

function onVideo(data) {
  const bytes = new Uint8Array(data);
  const type = bytes[0];
  const payload = bytes.subarray(9);
  if (type === 1) { configureVideo(payload); return; }
  if (!configured) configureVideo(payload);
  if (!video || !configured || video.state !== "configured") return;
  // A decoder rejects delta frames until it has seen a key frame.
  if (type === 2) needKey = false;
  else if (needKey) return;
  const nals = startCodes(payload);
  if (!nals.length) return;
  let ts = 0n;
  for (let i = 1; i <= 8; i++) ts = (ts << 8n) + BigInt(bytes[i]);
  video.decode(new EncodedVideoChunk({
    type: type === 2 ? "key" : "delta",
    timestamp: Number(ts),
    data: avcc(nals)
  }));
}

function stopVideo() {
  epoch += 1;
  clearTimeout(retryTimer);
  retryTimer = 0;
  const current = videoSocket;
  videoSocket = null;
  if (current) {
    current.onmessage = null;
    current.onerror = null;
    current.onclose = null;
    current.close();
  }
  if (video && video.state !== "closed") video.close();
  video = null;
  configured = false;
}

function startVideo() {
  if (document.visibilityState !== "visible") return;
  if (videoSocket) return;
  video = makeDecoder();
  if (!video) return;
  configured = false;
  lastPicture = performance.now();
  status.textContent = "Connecting";
  const vs = socket("/v1/stream/video");
  videoSocket = vs;
  vs.binaryType = "arraybuffer";
  vs.onmessage = (event) => {
    if (videoSocket !== vs) return;
    if (typeof event.data === "string") {
      onHeader(JSON.parse(event.data));
      return;
    }
    onVideo(event.data);
  };
  vs.onerror = () => {
    if (videoSocket === vs) status.textContent = "Video socket failed";
  };
  vs.onclose = (event) => {
    if (videoSocket !== vs) return;
    videoSocket = null;
    stopVideo();
    const reason = event.reason ? " " + event.reason : "";
    status.textContent = "Video socket closed " + event.code + reason + ". Retrying.";
    retryVideo();
  };
}

function retryVideo() {
  if (retryTimer || document.visibilityState !== "visible") return;
  const wait = retryMs;
  retryMs = Math.min(retryMs * 2, RETRY_MAX_MS);
  retryTimer = setTimeout(() => {
    retryTimer = 0;
    startVideo();
  }, wait);
}

setInterval(() => {
  if (!videoSocket || document.visibilityState !== "visible") return;
  if (performance.now() - lastPicture < STALL_MS) return;
  stopVideo();
  status.textContent = "No picture for " + STALL_MS / 1000 + " s. Reconnecting.";
  retryVideo();
}, 1000);

function syncVideo() {
  if (document.visibilityState === "visible") {
    startVideo();
    return;
  }
  stopVideo();
  status.textContent = streamWidth ? streamWidth + "×" + streamHeight + " paused" : "Paused";
}

document.addEventListener("visibilitychange", syncVideo);
syncVideo();

let audioDecoder = null;
let audioSocket = null;
let audioCtx = null;
// The audio socket's header: codec, sample rate, and channels, which configure its decoder.
let audioHeader = null;
let nextAt = 0;

function audioPlayable() {
  if (typeof AudioDecoder !== "function") return false;
  if (!audioCtx || audioCtx.state !== "running") return false;
  const session = navigator.audioSession;
  if (session && session.state === "interrupted") return false;
  return true;
}

function playAudio(data) {
  if (!audioCtx || audioCtx.state !== "running") {
    data.close();
    return;
  }
  const channels = [];
  for (let c = 0; c < data.numberOfChannels; c++) {
    const samples = new Float32Array(data.numberOfFrames);
    data.copyTo(samples, { planeIndex: c, format: "f32-planar" });
    channels.push(samples);
  }
  const buffer = audioCtx.createBuffer(data.numberOfChannels, data.numberOfFrames, data.sampleRate);
  for (let c = 0; c < channels.length; c++) buffer.copyToChannel(channels[c], c);
  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  source.connect(audioCtx.destination);
  const when = Math.max(audioCtx.currentTime, nextAt);
  source.start(when);
  nextAt = when + buffer.duration;
  data.close();
}

function onAudio(data) {
  const bytes = new Uint8Array(data);
  const payload = bytes.subarray(9);
  if (bytes[0] === 1) {
    if (audioDecoder || !audioHeader) return;
    const codec = audioHeader.codec === "aac" ? "mp4a.40.2" : "opus";
    audioDecoder = new AudioDecoder({
      output: playAudio,
      error(e) { status.textContent = String(e); }
    });
    try {
      audioDecoder.configure({
        codec,
        sampleRate: audioHeader.sampleRate,
        numberOfChannels: audioHeader.channels,
        description: payload,
      });
    } catch (error) {
      status.textContent = "AudioDecoder failed: " + error;
      stopAudio();
    }
    return;
  }
  if (!audioDecoder || audioDecoder.state !== "configured") return;
  let ts = 0n;
  for (let i = 1; i <= 8; i++) ts = (ts << 8n) + BigInt(bytes[i]);
  audioDecoder.decode(new EncodedAudioChunk({ type: "key", timestamp: Number(ts), data: payload }));
}

function stopAudio() {
  const current = audioSocket;
  audioSocket = null;
  if (current) {
    current.onmessage = null;
    current.onerror = null;
    current.onclose = null;
    current.close();
  }
  if (audioDecoder && audioDecoder.state !== "closed") audioDecoder.close();
  audioDecoder = null;
  audioHeader = null;
  nextAt = 0;
}

// The server closes the audio socket with 1003 (cannot accept) when the phone cannot capture
// audio at all, as on Android 10. That holds for the page's life, so it does not ask again.
const AUDIO_REFUSED = 1003;
let audioRefused = false;

function startAudio() {
  if (audioRefused || !audioPlayable() || audioSocket) return;
  const as = socket("/v1/stream/audio");
  audioSocket = as;
  as.binaryType = "arraybuffer";
  as.onmessage = (event) => {
    if (audioSocket !== as) return;
    if (typeof event.data === "string") {
      audioHeader = JSON.parse(event.data);
      return;
    }
    onAudio(event.data);
  };
  as.onclose = (event) => {
    if (audioSocket !== as) return;
    audioSocket = null;
    if (event.code === AUDIO_REFUSED) audioRefused = true;
    const reason = event.reason ? " " + event.reason : "";
    status.textContent = "Audio socket closed " + event.code + reason;
  };
}

function syncAudio() {
  if (audioPlayable()) startAudio();
  else stopAudio();
}

const audioSession = navigator.audioSession;
if (audioSession && audioSession.addEventListener) {
  audioSession.addEventListener("statechange", syncAudio);
}

document.body.addEventListener("pointerdown", unlockAudio, { once: true });

let inputQueue = Promise.resolve();
let pointerSocket = null;
let pointerRetry = null;
// The input socket reconnects at once after a drop, then backs off while the server is away.
const POINTER_RETRY_MIN_MS = 500;
const POINTER_RETRY_MAX_MS = 10000;
let pointerRetryMs = POINTER_RETRY_MIN_MS;
const contacts = new Map();
const usedSlots = new Set();
let gestureT0 = 0;
const MAX_CONTACTS = 10;
const TAP_SLOP = 12;
const MOVE_SLOP = 2;
const MOVE_MS = 16;

function unlockAudio() {
  if (typeof AudioContext !== "function") return;
  if (!audioCtx || audioCtx.state === "closed") {
    audioCtx = new AudioContext();
    audioCtx.addEventListener("statechange", syncAudio);
  }
  const pending = audioCtx.resume();
  if (pending && pending.then) pending.then(syncAudio, function () {});
  syncAudio();
}

// Only called with a picture drawn, so display is set.
function screenPoint(event) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (event.clientX - rect.left) * (display.widthPx / rect.width),
    y: (event.clientY - rect.top) * (display.heightPx / rect.height),
  };
}

// Who holds the screen, from the input socket. While someone else does, input is dropped.
const leaseOther = document.getElementById("lease-other");
const leaseTook = document.getElementById("lease-took");
const leaseMine = document.getElementById("lease-mine");
const takeButton = document.getElementById("take");
const HOLDERS = { agent: "an agent", person: "another viewer", script: "a script" };

function otherText(holder, minutes) {
  const held = minutes >= 1 ? " for " + minutes + " min" : "";
  return "In use by " + holder + held + ". Input is ignored until you take over.";
}

function tookText(holder) {
  return "You took over from " + holder +
    ". Press Done to give it back, or it gets the screen back 30 s after your last input.";
}

leaseMine.firstElementChild.textContent =
  "You have the screen. Press Done when you are finished, or others can use it 30 s after your last input.";
let lease = { holder: "none", since: 0, takenFrom: null };
let leaseTimer = null;

function onSocketMessage(data) {
  let message;
  try {
    message = JSON.parse(data);
  } catch (ignored) {
    return;
  }
  if (message.id !== undefined && settleCopy(message)) return;
  if (message.op === "lease") {
    lease = {
      holder: message.holder,
      since: performance.now() - (message.heldMs || 0),
      takenFrom: message.takenFrom || null,
    };
    showLease();
  } else if (message.op === "error" && message.message) {
    status.textContent = message.message;
  } else if (message.op === "notice") {
    showNotice(message.message);
  }
}

// Says why the picture differs from the screen, as when Chrome shows a popup it can't capture.
// No text hides it.
function showNotice(text) {
  notice.textContent = text || "";
  notice.hidden = !text;
}

function showLease() {
  const other = HOLDERS[lease.holder];
  const mine = lease.holder === "you";
  const took = mine && HOLDERS[lease.takenFrom];
  const minutes = Math.floor((performance.now() - lease.since) / 60000);
  // A hidden message keeps its longest form, so it holds the bar's height for when it shows.
  leaseOther.firstElementChild.textContent = otherText(other || HOLDERS.person, other ? minutes : 59);
  leaseTook.firstElementChild.textContent = tookText(took || HOLDERS.agent);
  leaseOther.classList.toggle("shown", Boolean(other));
  leaseTook.classList.toggle("shown", Boolean(took));
  leaseMine.classList.toggle("shown", mine && !took);
  if (other && leaseTimer === null) leaseTimer = setInterval(showLease, 15000);
  if (!other && leaseTimer !== null) {
    clearInterval(leaseTimer);
    leaseTimer = null;
  }
}

takeButton.addEventListener("click", () => sendPointer({ op: "take" }));
for (const done of document.querySelectorAll("#lease .done")) {
  done.addEventListener("click", () => sendPointer({ op: "release" }));
}
showLease();

// The button cycles from what it last set, starting from auto-rotate.
const ORIENTATIONS = ["auto", "0", "90", "180", "270"];
let orientation = "auto";

function showOrientation(value) {
  orientation = value;
  const button = document.getElementById("orientation");
  const label = value === "auto" ? "Auto-rotate" : value + "°";
  button.title = label;
  button.setAttribute("aria-label", label);
}

function cycleOrientation() {
  const index = ORIENTATIONS.indexOf(orientation);
  const next = ORIENTATIONS[(index < 0 ? 0 : index + 1) % ORIENTATIONS.length];
  sendPointer({ op: "orientation", orientation: next });
  showOrientation(next);
}

function connectPointer() {
  if (pointerRetry !== null) {
    clearTimeout(pointerRetry);
    pointerRetry = null;
  }
  const next = socket("/v1/input/pointer");
  pointerSocket = next;
  next.binaryType = "blob";
  next.onopen = () => {
    if (pointerSocket === next) pointerRetryMs = POINTER_RETRY_MIN_MS;
  };
  next.onmessage = (event) => {
    if (event.data instanceof Blob) onImageFrame(event.data);
    else onSocketMessage(event.data);
  };
  next.onclose = () => {
    if (pointerSocket !== next) return;
    contacts.clear();
    usedSlots.clear();
    gestureT0 = 0;
    failCopies();
    // The socket that replaces this one sends the notice again if it still holds.
    showNotice(null);
    status.textContent = "Lost the connection for input. Reconnecting.";
    pointerRetry = setTimeout(connectPointer, pointerRetryMs);
    pointerRetryMs = Math.min(pointerRetryMs * 2, POINTER_RETRY_MAX_MS);
  };
}

function allocSlot() {
  for (let id = 0; id < MAX_CONTACTS; id++) {
    if (!usedSlots.has(id)) {
      usedSlots.add(id);
      return id;
    }
  }
  return -1;
}

function gestureMs(timeStamp) {
  return Math.max(0, Math.round(timeStamp - gestureT0));
}

// Sends a message on the input socket. False, with the status saying so, when it is not open.
function sendPointer(body) {
  if (!pointerSocket || pointerSocket.readyState !== WebSocket.OPEN) {
    status.textContent = "Not connected to the phone's input. Reconnecting.";
    return false;
  }
  pointerSocket.send(JSON.stringify(body));
  return true;
}

function beginContact(event) {
  if (!display) return;
  if (event.pointerType === "mouse" && event.button !== 0) return;
  event.preventDefault();
  if (contacts.has(event.pointerId)) return;
  const id = allocSlot();
  if (id < 0) return;
  unlockAudio();
  canvas.setPointerCapture(event.pointerId);
  const point = screenPoint(event);
  if (contacts.size === 0) gestureT0 = event.timeStamp;
  const tMs = gestureMs(event.timeStamp);
  contacts.set(event.pointerId, {
    id: id,
    originX: point.x,
    originY: point.y,
    x: point.x,
    y: point.y,
    moved: false,
    lastX: point.x,
    lastY: point.y,
    lastT: tMs,
  });
  sendPointer({ op: "down", id: id, x: point.x, y: point.y, tMs: tMs });
}

// The last hover sent, so a resting mouse sends nothing.
let lastHover = { x: -1, y: -1, t: 0 };

// A mouse moving with no button down: the page under it sees the pointer move, as for hover menus.
function hover(event) {
  if (pointerKind !== "mouse" || event.pointerType !== "mouse" || !display) return;
  const point = screenPoint(event);
  const moved = Math.hypot(point.x - lastHover.x, point.y - lastHover.y);
  if (moved < MOVE_SLOP || event.timeStamp - lastHover.t < MOVE_MS) return;
  lastHover = { x: point.x, y: point.y, t: event.timeStamp };
  if (pointerSocket && pointerSocket.readyState === WebSocket.OPEN) {
    pointerSocket.send(JSON.stringify({ op: "hover", x: point.x, y: point.y }));
  }
}

function extendContact(event) {
  const contact = contacts.get(event.pointerId);
  if (!contact) {
    hover(event);
    return;
  }
  event.preventDefault();
  const point = screenPoint(event);
  const tMs = gestureMs(event.timeStamp);
  contact.x = point.x;
  contact.y = point.y;
  if (!contact.moved && Math.hypot(point.x - contact.originX, point.y - contact.originY) < TAP_SLOP) return;
  contact.moved = true;
  const moved = Math.hypot(point.x - contact.lastX, point.y - contact.lastY);
  if (moved < MOVE_SLOP && tMs - contact.lastT < MOVE_MS) return;
  contact.lastX = point.x;
  contact.lastY = point.y;
  contact.lastT = tMs;
  sendPointer({ op: "move", id: contact.id, x: point.x, y: point.y, tMs: tMs });
}

function endContact(event) {
  const contact = contacts.get(event.pointerId);
  if (!contact) return;
  const point = screenPoint(event);
  const tMs = gestureMs(event.timeStamp);
  contacts.delete(event.pointerId);
  usedSlots.delete(contact.id);
  const inside = !contact.moved &&
    Math.hypot(point.x - contact.originX, point.y - contact.originY) < TAP_SLOP;
  const x = inside ? contact.originX : point.x;
  const y = inside ? contact.originY : point.y;
  if (contacts.size === 0) gestureT0 = 0;
  sendPointer({ op: "up", id: contact.id, x: x, y: y, tMs: tMs });
}

function cancelContact(event) {
  const contact = contacts.get(event.pointerId);
  if (!contact) return;
  const tMs = gestureMs(event.timeStamp);
  contacts.delete(event.pointerId);
  usedSlots.delete(contact.id);
  if (contacts.size === 0) {
    gestureT0 = 0;
    sendPointer({ op: "cancel" });
    return;
  }
  sendPointer({ op: "up", id: contact.id, x: contact.x, y: contact.y, tMs: tMs });
}

canvas.addEventListener("pointerdown", beginContact);
canvas.addEventListener("pointermove", extendContact);
canvas.addEventListener("pointerup", endContact);
canvas.addEventListener("pointercancel", cancelContact);
canvas.addEventListener("contextmenu", (event) => event.preventDefault());

// Pixels a wheel line or page stands for, when the browser reports the wheel in those.
const WHEEL_LINE_PX = 40;

// The wheel scrolls the remote page by the same distance it would scroll this one, in its pixels.
canvas.addEventListener("wheel", (event) => {
  if (pointerKind !== "mouse" || !display) return;
  event.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const unit = event.deltaMode === 1 ? WHEEL_LINE_PX : event.deltaMode === 2 ? rect.height : 1;
  const point = screenPoint(event);
  sendPointer({
    op: "wheel",
    x: point.x,
    y: point.y,
    dx: event.deltaX * unit * (display.widthPx / rect.width),
    dy: event.deltaY * unit * (display.heightPx / rect.height),
  });
}, { passive: false });

// Cmd+C or Ctrl+C copies the phone's selection to this computer, or the phone's clipboard when
// nothing is selected, as text or an image. Cmd+V or Ctrl+V puts this computer's text or image on
// the phone's clipboard and pastes it into the focused field. Images go as binary frames.
const MAX_IMAGE_BYTES = 20 * 1024 * 1024;
let copyId = 0;
// Copies waiting for the phone. The server answers every one, with the clip or an error, so a copy
// waits until then, or until the socket it went on closes.
const copies = new Map();
// The copy whose image is in the next binary frame.
let imageCopy = null;
// What the phone's clipboard held at the last copy, which decides the type the next copy writes.
let phoneHoldsImage = false;

function phoneClipboard() {
  const id = ++copyId;
  return new Promise((resolve, reject) => {
    copies.set(id, { id: id, resolve: resolve, reject: reject });
    if (!sendPointer({ op: "copy", id: id })) {
      copies.delete(id);
      reject(new Error("Not connected to the phone. Try again in a moment."));
    }
  });
}

function settleCopy(message) {
  const pending = copies.get(message.id);
  if (!pending) return false;
  if (message.op === "clipboard" && message.image) {
    pending.message = message;
    imageCopy = pending;
    return true;
  }
  copies.delete(message.id);
  if (message.op === "clipboard" && typeof message.text === "string") pending.resolve(message);
  else pending.reject(new Error(message.message || "The phone's clipboard has no text or image."));
  return true;
}

function failCopies() {
  imageCopy = null;
  for (const pending of copies.values()) {
    pending.reject(new Error("The connection to the phone closed before it answered the copy."));
  }
  copies.clear();
}

function onImageFrame(blob) {
  const pending = imageCopy;
  imageCopy = null;
  if (!pending || !copies.has(pending.id)) return;
  copies.delete(pending.id);
  const message = pending.message;
  pending.resolve(Object.assign({}, message, { blob: new Blob([blob], { type: message.image }) }));
}

// Browsers take only PNG images for the clipboard.
async function pngOf(blob) {
  if (blob.type === "image/png") return blob;
  const bitmap = await createImageBitmap(blob);
  const canvas = document.createElement("canvas");
  canvas.width = bitmap.width;
  canvas.height = bitmap.height;
  canvas.getContext("2d").drawImage(bitmap, 0, 0);
  return new Promise((resolve, reject) => {
    canvas.toBlob((png) => (png ? resolve(png) : reject(new Error("Could not convert the image."))), "image/png");
  });
}

function clipBlob(message, type) {
  if (type === "image/png") {
    if (!message.blob) throw new Error("The phone's clipboard holds text, not an image.");
    return pngOf(message.blob);
  }
  if (typeof message.text !== "string") throw new Error("The phone's clipboard holds an image, not text.");
  return new Blob([message.text], { type: "text/plain" });
}

// A pending ClipboardItem keeps the key press's user activation while the phone answers, which
// Safari and Firefox need for the write. Its type has to be named before the answer comes.
function writeClip(clip, type) {
  const item = {};
  item[type] = clip.then((message) => clipBlob(message, type));
  return navigator.clipboard.write([new ClipboardItem(item)]);
}

function copyFromPhone() {
  if (!navigator.clipboard) {
    status.textContent = "This browser does not let the page write the clipboard here.";
    return;
  }
  const clip = phoneClipboard();
  clip.then((message) => { phoneHoldsImage = Boolean(message.blob); }, () => {});
  let written;
  if (window.ClipboardItem) {
    const guess = phoneHoldsImage ? "image/png" : "text/plain";
    written = writeClip(clip, guess).catch(async (error) => {
      const message = await clip;
      const actual = message.blob ? "image/png" : "text/plain";
      if (actual === guess) throw error;
      // Chrome writes again without a new key press. Safari and Firefox need one.
      return writeClip(Promise.resolve(message), actual).catch(() => {
        throw new Error("The phone's clipboard holds " + (message.blob ? "an image" : "text") + ". Copy again to get it.");
      });
    });
  } else {
    written = clip.then((message) => {
      if (typeof message.text !== "string") throw new Error("This browser can copy only text.");
      return navigator.clipboard.writeText(message.text);
    });
  }
  Promise.all([clip, written]).then(
    ([message]) => {
      const what = message.blob ? "image" : "text";
      status.textContent = message.changed
        ? "Copied the phone's selection."
        : "Nothing was selected on the phone. Copied its clipboard's " + what + ".";
    },
    (error) => {
      status.textContent = error.message || "Could not copy from the phone.";
    },
  );
}

document.addEventListener("paste", (event) => {
  event.preventDefault();
  const data = event.clipboardData;
  // Text first: Office and other apps put a picture of copied text beside the text.
  const text = data ? data.getData("text/plain") : "";
  if (text) {
    sendPointer({ op: "paste", text: text, autoWake: true });
    return;
  }
  const image = data ? Array.from(data.files).find((file) => file.type.startsWith("image/")) : null;
  if (!image) {
    status.textContent = "Only text and images can be pasted to the phone.";
    return;
  }
  if (image.size > MAX_IMAGE_BYTES) {
    status.textContent = "The image is too large to paste. The limit is 20 MB.";
    return;
  }
  if (pointerSocket && pointerSocket.readyState === WebSocket.OPEN) pointerSocket.send(image);
});

// Keys a desktop page uses that type no text, by the names the input socket's key takes.
const DESKTOP_KEYS = {
  Tab: "TAB",
  Escape: "ESCAPE",
  ArrowUp: "DPAD_UP",
  ArrowDown: "DPAD_DOWN",
  ArrowLeft: "DPAD_LEFT",
  ArrowRight: "DPAD_RIGHT",
  Delete: "FORWARD_DEL",
  Home: "MOVE_HOME",
  End: "MOVE_END",
  PageUp: "PAGE_UP",
  PageDown: "PAGE_DOWN",
};

document.addEventListener("keydown", (event) => {
  const shortcut = (event.metaKey || event.ctrlKey) && !event.altKey && !event.shiftKey;
  if (shortcut && event.key.toLowerCase() === "c") {
    event.preventDefault();
    copyFromPhone();
    return;
  }
  if (event.metaKey || event.ctrlKey || event.altKey || event.isComposing) return;
  const named = pointerKind === "mouse" ? DESKTOP_KEYS[event.key] : undefined;
  if (named) {
    event.preventDefault();
    sendPointer({ op: "key", key: named, autoWake: true });
    return;
  }
  if (event.key === "Backspace") {
    event.preventDefault();
    sendPointer({ op: "key", key: "DEL", autoWake: true });
    return;
  }
  let text = "";
  if (event.key === "Enter") text = "\n";
  else if (event.key.length === 1) text = event.key;
  if (!text) return;
  event.preventDefault();
  sendPointer({ op: "text", text: text, autoWake: true });
});

document.addEventListener("compositionend", (event) => {
  if (!event.data) return;
  sendPointer({ op: "text", text: event.data, autoWake: true });
});

document.getElementById("keys").addEventListener("pointerdown", (event) => {
  const button = event.target.closest("button");
  if (!button) return;
  event.preventDefault();
  unlockAudio();
  if (button.id === "orientation") {
    inputQueue = inputQueue.then(cycleOrientation).catch(() => {});
    return;
  }
  if (!button.dataset.key) return;
  sendPointer({ op: "key", key: button.dataset.key, autoWake: true });
});

connectPointer();
</script>
</body>
